[project]
name = "attendance-api"
version = "0.1.0"
description = "Secure professor and student attendance API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.6,<3",
    "PyJWT>=2.9,<3",
    "pwdlib[argon2]>=0.2,<1",
    "python-multipart>=0.0.20,<1",
    "email-validator>=2.2,<3",
    # Free, offline attendance-sheet reading: OCR engine, its runtime, and typo-tolerant name matching.
    "rapidocr>=3.10,<4",
    "onnxruntime>=1.20",
    "rapidfuzz>=3.10,<4",
    "pillow>=10",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
